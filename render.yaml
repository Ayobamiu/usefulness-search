# Render blueprint: one free web service. Secrets are set in the Render dashboard, never here.
services:
  - type: web
    name: xtract
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: OPENAI_API_KEY
        sync: false
      - key: KEENABLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://pxtefalibikzoewluzfu.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
